<!DOCTYPE html>
<!-- Tell the browser that this file uses modern HTML -->

<!-- Start the webpage and say its main language is English -->
<html lang="en">

<!-- Start the information about the page -->
<head>
    <!-- Allow letters, symbols and special characters to display correctly -->
    <meta charset="UTF-8">

    <!-- Make the page match the screen width on phones and computers -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the name shown on the browser tab -->
    <title>Discover Brunei 2027</title>

    <!-- Connect this page to style.css inside the css folder -->
    <link rel="stylesheet" href="css/style.css">

<!-- Finish the information about the page -->
</head>

<!-- Header shown on web browser -->
<header>
    <h1>Discover Brunei 2027</h1>
</header>

<!-- Start the content that visitors can see -->
<body>

    <!-- Start the top area containing the website name and menu -->
    <header>

        <!-- Show the main heading of the page -->
        <h1>Discover Brunei 2027</h1>

        <!-- Start the menu and name it for people using screen readers -->
        <nav aria-label="Main navigation">

            <!-- Link to Home and tell screen readers this is the current page -->
            <a href="index.html" aria-current="page">Home</a>

            <!-- Link to the page about Brunei -->
            <a href="discover.html">Discover Brunei 2027</a>

            <!-- Link to the page showing places to visit -->
            <a href="attractions.html">Attractions</a>

            <!-- Link to the page that helps visitors plan their trip -->
            <a href="plan.html">Plan Your Visit</a>

            <!-- Link to the page about events -->
            <a href="events.html">Events</a>

            <!-- Link to the contact page -->
            <a href="contact.html">Contact</a>

        <!-- Finish the menu -->
        </nav>

    <!-- Finish the top area -->
    </header>

    <!-- Start the main information for this page -->
    <main>

        <!-- Start a section and use welcome-heading as its accessible label -->
        <section aria-labelledby="welcome-heading">

            <!-- Give the heading an ID so the section can refer to it -->
            <h2 id="welcome-heading">Welcome to Brunei Darussalam</h2>

            <!-- Show a short welcome message -->
            <p>Explore Brunei’s culture, heritage and natural beauty.</p>

            <!-- Give visitors a link to explore places in Brunei -->
            <a href="attractions.html">Explore attractions</a>

        <!-- Finish the welcome section -->
        </section>

    <!-- Finish the main information -->
    </main>

    <!-- Start the bottom area of the page -->
    <footer>

        <!-- Explain that this website is a student project -->
        <p>Discover Brunei: Shahrul's website project.</p>

    <!-- Finish the bottom area -->
    </footer>

    <!-- Load the JavaScript file after the page content has been read -->
    <script src="js/script.js"></script>

<!-- Finish the visible page content -->
</body>

<!-- Finish the webpage -->
</html>
